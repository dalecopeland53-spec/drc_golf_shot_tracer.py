name: Build DRC Shot Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Find Android build tools
        id: tools
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          echo "dir=$ANDROID_HOME/build-tools/$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Verify release signature
        run: "${{ steps.tools.outputs.dir }}/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Verify release alignment
        run: "${{ steps.tools.outputs.dir }}/zipalign" -c -v 4 app/build/outputs/apk/release/app-release.apk

      - name: Inspect release package
        run: |
          "${{ steps.tools.outputs.dir }}/aapt" dump badging app/build/outputs/apk/release/app-release.apk
          if "${{ steps.tools.outputs.dir }}/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "application-debuggable"; then
            echo "ERROR: Release APK is still debuggable"
            exit 1
          fi
          echo "Release APK is non-debuggable"

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk DRC-SHOT-TRACKER-RELEASE-14.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DRC-SHOT-TRACKER-RELEASE-14
          path: DRC-SHOT-TRACKER-RELEASE-14.apk
          if-no-files-found: error
