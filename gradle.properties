# Specifies the JVM arguments used for the daemon process to tweak memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# FIXED: Enabled AndroidX support to ensure modern packages compile correctly.
android.useAndroidX=true

# RECOMMENDED: Forces legacy transitive plugins to migrate to AndroidX configurations automatically.
android.enableJetifier=true
